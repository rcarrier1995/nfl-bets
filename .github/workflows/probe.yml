name: probe
on:
  push:
    branches: [probe-experts]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out
          i=0
          while read -r u; do
            i=$((i+1))
            code=$(curl -sL -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -o probe/out/$i.html -w '%{http_code} %{size_download}' "$u")
            echo "$i $code $u" | tee -a probe/out/index.txt
          done <<'URLS'
          https://nflpickwatch.com/terms
          https://nflpickwatch.com/terms-of-service
          https://nflpickwatch.com/nfl/picks/su/experts
          https://www.cbssports.com/nfl/picks/
          https://www.cbssports.com/nfl/expert-picks/
          https://www.cbssports.com/nfl/picks/experts/
          https://www.oddsshark.com/nfl/expert-picks
          https://www.oddsshark.com/nfl/picks
          https://www.covers.com/picks/nfl
          https://www.covers.com/terms-of-use
          https://www.oddsshark.com/terms-of-use
          https://www.cbssports.com/terms-of-use/
          https://www.espn.com/nfl/story/_/page/nflpicks/nfl-expert-picks
          https://sports.yahoo.com/nfl/
          https://www.nbcsports.com/nfl/picks
          https://www.pff.com/nfl/picks
          URLS
          sed -i 's/^ *//' probe/out/index.txt
      - run: |
          git config user.name "nfl-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f probe/out/index.txt.bak; git add -f probe/out && git commit -q -m "probe output" && git push -q
