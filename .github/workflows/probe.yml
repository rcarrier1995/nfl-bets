name: probe
on:
  push:
    branches: [probe-experts]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out
          i=0
          while read -r u; do
            i=$((i+1))
            code=$(curl -sL -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -o probe/out/$i.html -w '%{http_code} %{size_download}' "$u")
            echo "$i $code $u" | tee -a probe/out/index.txt; sleep 2
          done <<'URLS'
          https://www.cbssports.com/nfl/picks/experts/straight-up/1/
          https://www.cbssports.com/nfl/picks/experts/straight-up/2/
          https://www.cbssports.com/nfl/picks/experts/straight-up/3/
          https://www.cbssports.com/nfl/picks/experts/straight-up/4/
          https://www.cbssports.com/nfl/picks/experts/straight-up/5/
          https://www.cbssports.com/nfl/picks/experts/straight-up/6/
          https://www.cbssports.com/nfl/picks/experts/straight-up/7/
          https://www.cbssports.com/nfl/picks/experts/straight-up/8/
          https://www.cbssports.com/nfl/picks/experts/straight-up/9/
          https://www.cbssports.com/nfl/picks/experts/straight-up/10/
          https://www.cbssports.com/nfl/picks/experts/straight-up/11/
          https://www.cbssports.com/nfl/picks/experts/straight-up/12/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/1/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/2/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/3/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/4/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/5/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/6/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/7/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/8/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/9/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/10/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/11/
          https://www.cbssports.com/nfl/picks/experts/against-the-spread/12/
          URLS
          sed -i 's/^ *//' probe/out/index.txt
      - run: |
          git config user.name "nfl-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f probe/out/index.txt.bak; git add -f probe/out && git commit -q -m "probe output" && git push -q
