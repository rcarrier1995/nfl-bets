name: tick
# One tick on demand. The regular heartbeat is loop.yml (GitHub's 10-minute schedule never fired
# on this repo). The tick decides (in Central time) what's due:
# Thu 12:00 pregame refresh, Sun 10:30 inactives, Thu/Sun 8:00 Top 3 push,
# live checks while games are on, Sun 15:35/18:50/23:00 window reviews,
# Mon 23:45 weekly learning review, hourly board refresh otherwise.
on:
  workflow_dispatch:
concurrency:
  group: nfl-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore feed cache (last good data)
        uses: actions/cache@v4
        with:
          path: state/cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - run: python -m engine.run tick
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          RUNDOWN_API_KEY: ${{ secrets.RUNDOWN_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "nfl-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state config.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i*5)); done
          exit 1
