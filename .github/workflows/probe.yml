name: probe
on:
  push:
    branches: [claude/project-thread-5jaym2]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "series_id=12185&closed=false&limit=50" "tag_id=450&closed=false&limit=50" "tag_id=100639&closed=false&limit=50"; do
          echo "=== $q"
          curl -s --compressed "https://gamma-api.polymarket.com/events?$q" -o ev.json
          python3 - <<'PY'
          import json
          d=json.load(open('ev.json'))
          if isinstance(d,dict): print('dict', list(d)[:10], str(d)[:300]); d=d.get('data') or d.get('events') or []
          print('n events', len(d))
          n=0
          for e in d:
              t=e.get('title') or ''
              print('E', e.get('slug'), '|', t, '|', e.get('startTime'), e.get('seriesSlug'), len(e.get('markets') or []))
              if (' vs' in t) and n<2:
                  n+=1
                  for m in (e.get('markets') or [])[:8]:
                      print('  M', {k:m.get(k) for k in ('question','slug','sportsMarketType','outcomes','outcomePrices','bestBid','bestAsk','lastTradePrice','volume24hr','volumeNum','gameStartTime','closed','line','active')})
          PY
          done
