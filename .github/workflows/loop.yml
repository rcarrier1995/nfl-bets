name: loop
# The heartbeat. GitHub's own 10-minute schedule turned out not to fire reliably on this repo,
# so one long job runs the tick in a loop: every 6 minutes while a game is on or about to start
# (Pages allows ~10 site builds an hour), every 10 minutes otherwise. After ~55 min it starts a
# fresh copy of itself and exits. The hourly schedule only restarts it if the chain ever breaks;
# a second copy just waits in the queue (concurrency) and takes over when the first ends.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
concurrency:
  group: nfl-loop
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore feed cache (last good data)
        uses: actions/cache/restore@v4
        with:
          path: state/cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - name: Tick in a loop
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          RUNDOWN_API_KEY: ${{ secrets.RUNDOWN_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nfl-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 55*60 ))   # restart hourly so a newly added secret (ODDS_API_KEY, NTFY_TOPIC) is live within the hour
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase -X theirs || true
            if python -m engine.run tick; then python -m engine.alarm tick ok || true; else echo "tick failed"; python -m engine.alarm tick fail || true; fi
            # weekly backup copy of all saved data as a GitHub Release file
            tag=$(python -m engine.backup due || true)
            if [ -n "$tag" ]; then
              { gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                { tar czf "/tmp/$tag.tar.gz" --exclude=state/cache state docs/data config.json && \
                gh release create "$tag" "/tmp/$tag.tar.gz" -R "$GITHUB_REPOSITORY" --latest=false \
                  --title "Data backup $tag" --notes "Weekly copy of saved prices, learning and results (state/, docs/data, config.json)."; }; } && \
                python -m engine.backup done "$tag" || echo "backup failed"
            fi
            git add docs/data state config.json
            if ! git diff --cached --quiet; then
              git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
            fi
            wait_s=$(python -m engine.loop_wait)
            echo "next tick in ${wait_s}s"
            sleep "$wait_s"
          done
      - name: Save feed cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/cache
          key: feeds-${{ github.run_id }}
      - name: Start the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run loop.yml --ref main -R ${{ github.repository }}
