name: refresh-odds
# Refresh button in the app: Actions -> refresh-odds -> Run workflow -> Run.
# Pulls The Odds API + TheRundown now, unless they were pulled under 30 minutes ago (engine/quota.py).
on:
  workflow_dispatch:
concurrency:
  group: nfl-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: state/cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - run: python -m engine.run odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          RUNDOWN_API_KEY: ${{ secrets.RUNDOWN_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "nfl-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "refresh odds: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i*5)); done
          exit 1
