name: weekly-retest
# Tuesday 5:00 AM Central (after Monday night's play-by-play posts): re-test every grade and
# signal with the newest games. A grade moves prices only while it keeps beating the line.
on:
  schedule:
    - cron: "0 11 * * 2"
  workflow_dispatch:
concurrency:
  group: nfl-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m engine.retest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "nfl-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/*.json docs/data/drive_odds.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "weekly re-test: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i*5)); done
          exit 1
