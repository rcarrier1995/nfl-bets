name: probe
on:
  push:
    branches: [probe-experts]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out
          i=0
          while read -r u; do
            i=$((i+1))
            code=$(curl -sL -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -o probe/out/$i.html -w '%{http_code} %{size_download}' "$u")
            echo "$i $code $u" | tee -a probe/out/index.txt; sleep 2
          done <<'URLS'
          https://www.nfl.com/robots.txt
          https://www.nfl.com/news/nfl-picks-week-1-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-2-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-3-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-4-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-5-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-6-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-7-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-8-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-9-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-10-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-11-2026-nfl-season
          https://www.nfl.com/news/nfl-picks-week-12-2026-nfl-season
          https://www.espn.com/nfl/picks/_/week/11/seasontype/2
          https://www.thescore.com/robots.txt
          https://www.thescore.com/nfl/news/2482668
          https://www.rotowire.com/robots.txt
          https://www.rotowire.com/football/article/beating-the-book-98710
          https://www.si.com/robots.txt
          URLS
          sed -i 's/^ *//' probe/out/index.txt
      - run: |
          git config user.name "nfl-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f probe/out/index.txt.bak; git add -f probe/out && git commit -q -m "probe output" && git push -q
